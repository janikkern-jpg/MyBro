[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# TypeScript-Functions werden von esbuild gebündelt.
[functions]
  node_bundler = "esbuild"

# gpt-image-1 kann pro Bild 15–25 s brauchen; Standard-Sync-Timeout
# (10 s) reicht dafür nicht → auf das Sync-Maximum von 26 s heben.
# Achtung: Dieses Maximum steht nur auf bezahlten Plänen zur
# Verfügung. Auf Free wird Netlify weiterhin bei 10 s abschneiden.
[functions."generate-image"]
  timeout = 26

# Kurzer Alias für den Chat-Endpunkt.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# SPA-Fallback: alle Client-Routen der React-App auf index.html leiten,
# aber /api/* und /.netlify/* vorher davon ausnehmen (Reihenfolge zählt).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Lokaler `netlify dev`-Standardport.
[dev]
  targetPort = 5173
  port = 8888
  framework = "vite"
